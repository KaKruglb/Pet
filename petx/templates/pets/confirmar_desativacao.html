{% extends "base.html" %}
{% block title %}Excluir {{ pet.nome }} — DevsPets{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card">
      <h2>Excluir {{ pet.nome }}?</h2>
      <p class="sub">Essa ação remove {{ pet.nome }} da lista de adoção. Você pode confirmar abaixo.</p>
      <form method="post">
        {% csrf_token %}
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary btn-block">Sim, excluir</button>
          <a href="{% url 'detalhe_pet' pet.pk %}" class="btn btn-ghost btn-block">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
