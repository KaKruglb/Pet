{% extends "base.html" %}
{% block title %}Entrar — DevsPets{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card">
      <h2>Bem-vindo de volta!</h2>
      <p class="sub">Faça seu login para continuar.</p>

      {% if erro %}<div class="form-error">{{ erro }}</div>{% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="form-footnote">Ainda não tem uma conta? <a href="{% url 'cadastro' 'adotante' %}">Criar conta</a></p>
    </div>
  </div>
</section>
{% endblock %}
